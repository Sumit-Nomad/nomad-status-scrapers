name: Keep scheduled workflows enabled

# GitHub disables scheduled workflows in a public repo after 60 days with no repository
# activity. A real commit once a month counts as activity.
on:
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record a keepalive commit
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
          git config user.name "keepalive"
          git config user.email "keepalive@users.noreply.github.com"
          git add .keepalive
          git commit -m "keepalive $(cat .keepalive)"
          git push
